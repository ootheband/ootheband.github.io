<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<nav class="drawer" id="drawer" hidden aria-label="メニュー">
  <div class="drawer-head">
    <span class="logo"><img src="images/logo.png" alt="Oo" width="414" height="240"></span>
    <button class="close-btn" id="menuClose">閉じる</button>

    <li><a href="news.html">NEWS</a></li>

    <li><a href="index.html#goods">GOODS</a></li>
  </ul>
</nav>

<main class="wrap">

  <!-- ===== パンくずリスト ===== -->
  <nav class="crumbs" aria-label="パンくずリスト">
    <ol><li><a href="index.html">TOP</a></li><li>&gt;</li><li aria-current="page">LIVE</li></ol>
  </nav>

  <h1 class="page-title">LIVE</h1>

  <!-- ===== ライブ一覧 =====
       ここは手で書かない。Googleスプレッドシートに1行足すと、js/main.js が自動でここに並べる。
       各ライブには id（live-年月日）が付き、ホームのLIVE欄からその位置へ直接飛べる -->
  <div id="livePage"></div>

</main>

<footer>
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="ホームへ戻る"><img src="images/logo.png" alt="Oo" width="414" height="240"></a>
    <span>© Oo</span>
  </div>
